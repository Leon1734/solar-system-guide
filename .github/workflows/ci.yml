name: 回归测试 / Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 轨道数学验证 / Orbital math
        run: node test/orbit.test.js
      - name: 数据与物理验证 / Data & physics
        run: node test/v2.test.js
      - name: 引导完整性静态检查 / Boot integrity
        run: node test/boot-check.js
